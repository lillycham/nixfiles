# Sort ~/Downloads and ~/Pictures/memes into folders by file type,
# ~/Pictures/Screenshots into folders by month, and ~/Documents by content.
# Try changes with `organize sim` before `organize run`.
#
# Files that match no rule stay where they are. Partial downloads
# (.crdownload, .part, Safari's .download) match no rule, so they are safe.

rules:
  - name: Images
    locations: &downloads ~/Downloads
    filters:
      - extension: [png, gif, webp, jpg, jpeg, jfif, heic, svg, avif, bmp, tiff]
    actions:
      - move: { dest: ~/Downloads/Images/, on_conflict: rename_new }

  - name: Video
    locations: *downloads
    filters:
      - extension: [webm, mkv, mp4, mov, avi, m4v]
    actions:
      - move: { dest: ~/Downloads/Video/, on_conflict: rename_new }

  - name: Audio
    locations: *downloads
    filters:
      - extension: [m4a, mp3, flac, wav, ogg, opus, aiff]
    actions:
      - move: { dest: ~/Downloads/Audio/, on_conflict: rename_new }

  # Books and documents go to ~/Documents. The "Sort documents" rule below
  # sorts PDFs and office files there by content.
  - name: Books
    locations: *downloads
    filters:
      - extension: [azw3, epub, mobi, mhtml, djvu, cbz, cbr]
    actions:
      - move: { dest: ~/Documents/Books/, on_conflict: rename_new }

  - name: Documents to sort
    locations: *downloads
    filters:
      - extension: [pdf, doc, docx, odt, rtf, pages]
    actions:
      - move: { dest: ~/Documents/, on_conflict: rename_new }

  - name: Documents
    locations: *downloads
    filters:
      - extension: [csv, txt, md, html, json, m3u8, xls, xlsx, ppt, pptx]
    actions:
      - move: { dest: ~/Downloads/Documents/, on_conflict: rename_new }

  - name: Installers
    locations: *downloads
    filters:
      - extension: [dmg, pkg, exe, msi, crx, xpi, jar, bin]
    actions:
      - move: { dest: ~/Downloads/Installers/, on_conflict: rename_new }

  - name: Installer apps
    locations: *downloads
    targets: dirs
    filters:
      - regex: '\.app$'
    actions:
      - move: { dest: ~/Downloads/Installers/, on_conflict: rename_new }

  - name: Archives
    locations: *downloads
    filters:
      - extension: [zip, 7z, rar, gz, tgz, xz, bz2, zst, tar]
    actions:
      - move: { dest: ~/Downloads/Archives/, on_conflict: rename_new }

  - name: Config
    locations: *downloads
    filters:
      - extension: [mobileconfig, itermcolors, ttc, ttr, ttrm]
    actions:
      - move: { dest: ~/Downloads/Config/, on_conflict: rename_new }

  - name: Code
    locations: *downloads
    filters:
      - extension: [js, ts, py, c, h, rs, go, sh, el, nix, hs, lisp, rkt]
    actions:
      - move: { dest: ~/Downloads/Code/, on_conflict: rename_new }

  - name: Fonts
    locations: *downloads
    filters:
      - extension: [ttf, otf, woff, woff2]
    actions:
      - move: { dest: ~/Downloads/Fonts/, on_conflict: rename_new }

  # ~/Pictures/memes: images, GIFs and videos get their own folders. Any
  # other folders go into Collections.
  - name: Meme GIFs
    locations: &memes ~/Pictures/memes
    filters:
      - extension: gif
    actions:
      - move: { dest: ~/Pictures/memes/GIFs/, on_conflict: rename_new }

  - name: Meme images
    locations: *memes
    filters:
      - extension: [png, webp, jpg, jpeg, jfif, heic, avif, bmp]
    actions:
      - move: { dest: ~/Pictures/memes/Images/, on_conflict: rename_new }

  - name: Meme videos
    locations: *memes
    filters:
      - extension: [mp4, mov, webm, mkv, m4v]
    actions:
      - move: { dest: ~/Pictures/memes/Video/, on_conflict: rename_new }

  - name: Meme collections
    locations: *memes
    targets: dirs
    filters:
      - regex: '^(?!(Images|GIFs|Video|Collections)$)'
    actions:
      - move: { dest: ~/Pictures/memes/Collections/, on_conflict: rename_new }

  # ~/Pictures/Screenshots: file screenshots and screen recordings by the
  # month in their name, e.g. 2026-09/. macOS writes a hidden temp file
  # first, and organize skips hidden files.
  - name: Screenshots by month
    locations: ~/Pictures/Screenshots
    filters:
      - regex: '^Screen(shot| Recording) (?P<year>\d{4})-(?P<month>\d{2})-'
    actions:
      - move: { dest: '~/Pictures/Screenshots/{regex.year}-{regex.month}/', on_conflict: rename_new }

  # ~/Downloads clean-up. These rules depend on time, so the agent also runs
  # once a day.

  # Installers are rarely needed again after a month. Their modified time is
  # the download time.
  - name: Trash old installers
    locations: &installers ~/Downloads/Installers
    filters:
      - lastmodified: { days: 30 }
    actions:
      - trash

  - name: Trash old installer apps
    locations: *installers
    targets: dirs
    filters:
      - lastmodified: { days: 30 }
    actions:
      - trash

  # Move things that nobody has opened or changed for 90 days into
  # Old/<category>/. date_lastused fails on files that were never opened,
  # so this checks both dates itself.
  - name: Move stale downloads to Old
    locations: &categories
      - ~/Downloads/Images
      - ~/Downloads/Video
      - ~/Downloads/Audio
      - ~/Downloads/Documents
      - ~/Downloads/Archives
      - ~/Downloads/Config
      - ~/Downloads/Code
      - ~/Downloads/Fonts
      - ~/Downloads/Apps & Tools
      - ~/Downloads/Misc
    filters: &stale
      - python: |
          import subprocess
          from datetime import datetime, timedelta, timezone
          last = datetime.fromtimestamp(path.stat().st_mtime, timezone.utc)
          used = subprocess.run(
              ["mdls", "-raw", "-name", "kMDItemLastUsedDate", str(path)],
              capture_output=True, text=True,
          ).stdout.strip()
          if used and used != "(null)":
              last = max(last, datetime.strptime(used, "%Y-%m-%d %H:%M:%S %z"))
          return last < datetime.now(timezone.utc) - timedelta(days=90)
    actions:
      - move: { dest: '~/Downloads/Old/{path.parent.name}/', on_conflict: rename_new }

  - name: Move stale download folders to Old
    locations: *categories
    targets: dirs
    filters: *stale
    actions:
      - move: { dest: '~/Downloads/Old/{path.parent.name}/', on_conflict: rename_new }

  # ~/Documents: sort documents at the top level into Books, Papers,
  # Receipts, Bank Statements or Misc. PDFs are sorted by page count and the
  # text on their first two pages. Folders and other files stay put.
  - name: Sort documents
    locations: ~/Documents
    filters:
      - extension: [pdf, epub, mobi, azw3, djvu, cbz, cbr, doc, docx, odt, rtf, pages]
      - python: |
          import re
          from pdfminer.high_level import extract_text
          from pdfminer.pdfpage import PDFPage
          ext = path.suffix.lower()
          if ext in {".epub", ".mobi", ".azw3", ".djvu", ".cbz", ".cbr"}:
              return {"category": "Books"}
          if ext != ".pdf":
              return {"category": "Misc"}
          try:
              with path.open("rb") as f:
                  pages = sum(1 for _ in PDFPage.get_pages(f))
              text = extract_text(str(path), maxpages=2)
          except Exception:
              return {"category": "Misc"}
          text = " ".join(text.split())
          def has(pattern):
              return re.search(pattern, text, re.IGNORECASE)
          if pages <= 20 and has(r"opening balance|closing balance|statement period|sort code"):
              return {"category": "Bank Statements"}
          if pages <= 5 and has(r"\b(receipt|invoice|order (number|confirmation)|amount paid|date paid|total due)\b"):
              return {"category": "Receipts"}
          if has(r"\babstract\b|thesis submitted|proceedings|\bdoi\b|arxiv") or "proceedings" in path.name.lower():
              return {"category": "Papers"}
          if pages >= 100:
              return {"category": "Books"}
          return {"category": "Misc"}
    actions:
      - move: { dest: '~/Documents/{python.category}/', on_conflict: rename_new }
